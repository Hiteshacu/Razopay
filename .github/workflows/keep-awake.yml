# Keeps the signing engine awake.
#
# A free Render instance sleeps after fifteen minutes without inbound traffic
# and takes about a minute to wake, so the first person to sign in after a
# quiet spell waits through a cold start. This knocks on the door often enough
# that the door never closes.
#
# Deliberately NOT every ten minutes around the clock. Render allows 750 free
# instance hours per workspace per calendar month, and a sleeping service
# spends none of them while an awake one spends all of them. A 31-day month is
# 744 hours, so keeping the service up continuously leaves six hours of margin
# — and going over does not throttle the service, it suspends it until the
# next month. That is a far worse failure than a cold start.
#
# So this runs 01:00-19:59 UTC, which is 06:30-01:29 in India: awake through
# every hour anyone would be using or demonstrating it, asleep while nobody
# is. About 589 hours a month, leaving 160 in hand.
#
# To keep it awake around the clock anyway, change the schedule to
# "*/10 * * * *" and watch the hours in the Render dashboard.

name: Keep the signing engine awake

on:
  schedule:
    - cron: "*/10 1-19 * * *"
  # Run it by hand before a demo, from the Actions tab.
  workflow_dispatch:

# A run that is still going when the next one fires is a run that is stuck.
concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API
        run: |
          URL="https://trust-shield-api.onrender.com/api/ping"

          # A cold start takes about a minute, so the first attempt needs a
          # generous timeout. Three tries, because a single missed request
          # here means a cold start for a real person later.
          for attempt in 1 2 3; do
            start=$(date +%s)
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            elapsed=$(( $(date +%s) - start ))

            if [ "$code" = "200" ]; then
              if [ "$elapsed" -gt 15 ]; then
                echo "Woke it after ${elapsed}s — it had gone to sleep."
              else
                echo "Already awake (${elapsed}s)."
              fi
              cat /tmp/body
              exit 0
            fi

            echo "Attempt $attempt: HTTP $code after ${elapsed}s"
            [ "$attempt" -lt 3 ] && sleep 15
          done

          echo "::error::The API did not answer after three attempts."
          exit 1
