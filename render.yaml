# Render Blueprint — Digital Trust Shield
#
# Two services: the Docker API (paid, has the persistent disk) and the admin
# portal as a free static site.
#
# Values marked `sync: false` are NOT stored here. Render prompts for them once
# at deploy time and keeps them encrypted. Never put MASTER_KEY or API keys in
# this file — it is committed to git.

services:
  # ---------------------------------------------------------------
  # Signing + verification + chatbot API
  # ---------------------------------------------------------------
  - type: web
    name: trust-shield-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free instances have 512 MB RAM and no persistent disk, and they spin
    # down after ~15 minutes idle. Measured peak while signing a 1600px
    # poster: 264 MB, so the memory headroom is fine. Because there is no
    # disk, the registry and encrypted private keys live in Firestore
    # instead — see REGISTRY_BACKEND / KEY_STORE_BACKEND below.
    plan: free
    region: singapore       # closest to India — lowest latency for the demo
    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      # --- Secrets: entered once in the Render dashboard, never committed ---
      - key: MASTER_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # --- Firebase service account, uploaded as a Render Secret File ---
      # Dashboard → Environment → Secret Files → filename serviceAccountKey.json
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/serviceAccountKey.json

      # --- Non-secret configuration ---
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: USE_LOCAL_STORAGE
        value: "true"
      - key: FIREBASE_STORAGE_BUCKET
        value: ""
      - key: STORAGE_MAKE_PUBLIC
        value: "false"
      - key: CORS_ORIGINS
        value: https://trust-shield-admin.onrender.com

      # There is no persistent disk on the free plan, so the two pieces of
      # state that must outlive a restart are kept in Firestore. Private keys
      # are stored as Fernet ciphertext only — MASTER_KEY never leaves this
      # environment, so Firestore never holds anything usable.
      - key: REGISTRY_BACKEND
        value: firestore
      - key: KEY_STORE_BACKEND
        value: firestore

      # Free instances get roughly a tenth of a CPU. Measured there with the
      # full self-check, signing took 220s and the request died at the
      # gateway; checking only that the signed file verifies directly brings
      # it to ~34s. Set this back to "full" on a host with real CPU.
      - key: SIGN_SELF_CHECK
        value: fast
      # Recovery budgets are wall-clock and were tuned on a fast machine.
      # Unscaled, they expire here before a single candidate is tested.
      - key: DTS_RECOVERY_BUDGET_MULTIPLIER
        value: "8"
      # An image with no watermark is the expensive case: every recovery tier
      # runs to exhaustion before the verdict is known. Unbounded on this
      # instance that exceeded ten minutes and the caller saw a gateway error
      # rather than a verdict. Cap it well inside the proxy timeout so a
      # negative answer still arrives as an answer.
      - key: DTS_VERIFY_DEADLINE_SECONDS
        value: "35"

      # Admin authentication. Leave false only while Firebase Auth is being
      # set up and the first operator signs in — while it is false the signing
      # and key-generation endpoints are open to anyone who finds the URL.
      # Switch to true before this deployment is shown publicly.
      - key: REQUIRE_ADMIN_AUTH
        value: "false"
      # Comma-separated emails approved automatically on first sign-in, so the
      # first operator does not need an existing admin to let them in.
      - key: ADMIN_EMAILS
        sync: false
      # Where approval requests are emailed. Defaults to the first ADMIN_EMAILS
      # entry when unset.
      - key: APPROVAL_NOTIFY_EMAIL
        sync: false
      # Origin used to build the link inside approval emails.
      - key: PORTAL_BASE_URL
        value: https://trust-shield-admin.onrender.com
      # SMTP for approval emails. Leave unset and signups still work — the
      # request is recorded and can be approved from the console instead.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # ---------------------------------------------------------------
  # Admin portal (free static hosting) + the judges' APK download page
  # ---------------------------------------------------------------
  - type: web
    name: trust-shield-admin
    runtime: static
    rootDir: admin-portal
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://trust-shield-api.onrender.com
      # Firebase web config, read at build time. Not secrets — they identify
      # the project and ship inside the bundle either way. Enter them once in
      # the dashboard; access is enforced by the backend verifying ID tokens.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      # The APK landing page is plain HTML sitting in public/apk/. This rule
      # must come first: the SPA catch-all below would otherwise answer /apk
      # with the React app.
      - type: rewrite
        source: /apk
        destination: /apk/index.html
      - type: rewrite
        source: /*
        destination: /index.html
